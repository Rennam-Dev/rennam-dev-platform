services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rennam_test
      POSTGRES_USER: rennam_test_runner
      POSTGRES_PASSWORD: discardable-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rennam_test_runner -d rennam_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test-only

  verify:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://rennam_test_runner:discardable-test-only@test-db:5432/rennam_test
    depends_on:
      test-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - test-only

networks:
  test-only:
    internal: true
