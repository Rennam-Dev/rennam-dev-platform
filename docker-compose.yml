services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rennam_dev
      POSTGRES_USER: rennam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rennam -d rennam_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rennam:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/rennam_dev
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 \
          --proxy-headers --forwarded-allow-ips "$$FORWARDED_ALLOW_IPS"

volumes:
  postgres_data:
